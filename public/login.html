<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Time</title>
    <script src="./js/sessao.js"></script>
    <link rel="stylesheet" href="../css/cadastro_login.css">
</head>

<body>

    <header class="pag">

        <div class="lado_esquerdo">

            <div class="cabecalho">
                <img src="../assets/icon/Marca Meu Time Stats (1).svg">
                <a href="index.html">Voltar ao início</a>
            </div>

            <div class="campos">

                <div class="titulo">
                    <span>O FUTEBOL VIVE AQUI</span>
                    <h1>ACOMPANHE O SEU TIME</h1>
                    <p>Entre na sua conta para conferir os números <br> e o desempenho atualizado do seu time.</p>
                </div>

                <div class="grupo_ipt">
                    <p class="txt_ipt">E-mail</p>
                    <input type="text" id="email" placeholder="Digite seu email">
                </div>
                <div class="grupo_ipt">
                    <p class="txt_ipt">Senha</p>
                    <input type="password" id="senha" placeholder="Digite sua senha">
                </div>

                <div class="grupo_ipt_num2">
                    <p id="mensagem_erro"></p>
                    <button onclick="conta()" class="btn_criar">Login<img src="../assets/icon/pelota.svg"></button>
                </div>

                <div class="grupo_ipt">
                    <p>Ainda não tem conta? <a href="../cadastro.html">Criar conta</a>
                    </p>
                </div>

                <div class="icons">
                    <img src="../assets/icon/pelota2.svg"><img src="../assets/icon/redes.svg" alt="">
                </div>

            </div>

        </div>

        <div class="img1"><img src="../assets/imagem/fifa27.avif"></div>
    </header>

</body>

</html>

<script>

    function conta() {

        var emailVar = email.value;
        var senhaVar = senha.value;

        mensagem_erro.textContent = "";

        if (emailVar == "" || senhaVar == "") {
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            return false;
        }

        // console.log("FORM LOGIN: ", emailVar);
        // console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;

                    setTimeout(function () {
                        window.location = "perfil.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
            mensagem_erro.textContent = texto || "Não foi possível entrar.";
        })

        return false;
    }

</script>
